<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecdc">
<meta name="description" content="Suffa specialty coffee — menu">
<title>Suffa Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@700&display=swap">
<style>
/* Layout: one column, sticky category rail, editorial rows with leader dots. Ivory Press palette. */
:root{
  --paper:#f4ecdc;--paper2:#ece2cc;--ink:#2a1a12;--ink2:#6b5443;--ink3:#8a7461;--acc:#b4502c;--rule:#c9b79c;--rule2:rgba(201,183,156,.55);
  --f-ar:"Noto Naskh Arabic",serif;--f-en:"Cormorant Garamond",Georgia,serif;--f-logo:"Reem Kufi",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.4;
  background-image:radial-gradient(circle at 18% 8%,rgba(180,80,44,.08),transparent 30%),radial-gradient(circle at 85% 95%,rgba(180,80,44,.07),transparent 30%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 30px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header.top{text-align:center;padding:26px 0 10px;position:relative}
.lang{position:absolute;top:22px;inset-inline-end:0;display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;font-family:var(--f-en);font-weight:700;font-size:13px;letter-spacing:1px}
.lang button{background:none;border:0;color:var(--ink);padding:5px 10px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.logo{font-family:var(--f-logo);font-weight:700;font-size:54px;line-height:1;color:var(--ink);direction:rtl}
.logo b{color:var(--acc);font-weight:700}
.tag{color:var(--ink2);margin-top:4px;font-size:15px}
.est{font-family:var(--f-en);font-weight:500;font-size:12px;letter-spacing:4px;color:var(--acc);text-transform:uppercase;margin-top:6px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 6px;color:var(--acc)}
.orn i{flex:0 1 120px;border-top:1px solid var(--ink)}.orn i:first-child,.orn i:last-child{border-color:var(--rule)}
.orn s{text-decoration:none;font-family:var(--f-en);font-size:14px}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 6px;border-bottom:1px solid var(--rule);margin:0 -16px;padding-left:16px;padding-right:16px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;background:var(--paper2);margin-bottom:8px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink3)}
.search svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--rule);background:none;color:var(--ink2);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}

section{padding-top:22px}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 4px;border-bottom:2px solid var(--ink);padding-bottom:6px;
  font-family:var(--f-logo);font-weight:700;font-size:22px;line-height:1.1}
h2 em{font-family:var(--f-en);font-style:normal;font-weight:700;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--acc)}
.sub{text-align:center;color:var(--ink2);font-size:13px;margin:6px 0 2px}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule2)}
.it:last-child{border-bottom:0}
.it .nm{min-width:0}
.it .nm b{display:block;font-weight:700;font-size:17px;line-height:1.15}
.it .nm em{display:block;font-family:var(--f-en);font-style:normal;font-weight:500;font-size:13px;color:var(--ink3);letter-spacing:.3px}
.k{font-size:11px;color:var(--ink3);white-space:nowrap}
.ld{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-5px);min-width:14px}
.p{font-family:var(--f-en);font-weight:700;font-size:21px;color:var(--acc);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--ink3);padding:40px 0;font-style:italic;font-family:var(--f-en);font-size:18px}

footer{text-align:center;padding:30px 0 10px;border-top:1px solid var(--ink);margin-top:30px;color:var(--ink2);font-size:12px}
footer .slog{font-family:var(--f-logo);font-weight:700;font-size:20px;color:var(--acc)}
footer .slog em{display:block;font-family:var(--f-en);font-style:italic;font-weight:500;font-size:14px;color:var(--ink2)}
footer p{margin:6px 0}
.phone{font-family:var(--f-en);font-weight:700;font-size:18px;letter-spacing:2px;color:var(--ink);direction:ltr}

</style>
</head>
<body>

<div class="wrap">
<header class="top">
  <div class="lang" role="group" aria-label="Language"><button id="bAr" aria-pressed="true">AR</button><button id="bEn" aria-pressed="false">EN</button></div>
  <div class="logo">ص<b>ُ</b>فّة</div>
  <div class="tag" data-ar="قهوة مختصة ..." data-en="Specialty Coffee ..."></div>
  <div class="est" data-ar="Specialty Coffee · Riyadh" data-en="Specialty Coffee · Riyadh"></div>
  <div class="orn"><i></i><s>✦</s><i></i><s>✦</s><i></i></div>
</header>

<div class="rail">
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></label>
  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
</div>

<main id="menu"></main>

<footer>
  <div class="slog" data-ar="أصالة في كل فنجال" data-en="Authenticity in every cup"><span></span><em data-ar="Authenticity in every cup" data-en="أصالة في كل فنجال"></em></div>
  <p data-ar="الدرهمية – شارع الأفلاج · مقابل مشغل شيفون" data-en="Al‑Dirhamiyah – Al‑Aflaj St. · opposite Chiffon Atelier"></p>
  <p class="phone">0599929287</p>
  <p data-ar="الأسعار بالريال السعودي وشاملة ضريبة القيمة المضافة · السعرات الحرارية تقريبية للحصة الواحدة" data-en="Prices in SAR, inclusive of VAT · Calories are approximate, per serving"></p>
</footer>
</div>

<script>
const DATA = [{"id": "espresso", "en": "Espresso", "ar": "الإسبريسو", "sub": null, "items": [{"ar": "إسبريسو سنجل", "en": "Single Espresso", "kcal": 5, "price": "8"}, {"ar": "إسبريسو دبل", "en": "Double Espresso", "kcal": 10, "price": "10"}, {"ar": "أمريكانو", "en": "Americano", "kcal": 15, "price": "10"}, {"ar": "كورتادو", "en": "Cortado", "kcal": 60, "price": "10"}, {"ar": "فلات وايت", "en": "Flat White", "kcal": 110, "price": "14"}, {"ar": "كابتشينو", "en": "Cappuccino", "kcal": 120, "price": "15"}, {"ar": "لاتيه", "en": "Latte", "kcal": 190, "price": "15"}, {"ar": "سبانش لاتيه", "en": "Spanish Latte", "kcal": 250, "price": "15"}, {"ar": "أفوقاتو", "en": "Affogato", "kcal": null, "price": "14"}]}, {"id": "filter", "en": "Filter Coffee", "ar": "القهوة المقطّرة", "sub": "حار / بارد · Hot / Iced", "items": [{"ar": "V60", "en": "Pour‑over V60", "kcal": 5, "price": "15 / 15"}, {"ar": "قهوة اليوم", "en": "Coffee of the Day", "kcal": 5, "price": "8 / 9"}]}, {"id": "hot", "en": "Hot Drinks", "ar": "مشروبات ساخنة", "sub": null, "items": [{"ar": "هوت تشوكلت", "en": "Hot Chocolate", "kcal": 300, "price": "13"}, {"ar": "سحلب", "en": "Sahlab", "kcal": 250, "price": "8"}, {"ar": "قهوة تركي", "en": "Turkish Coffee", "kcal": 10, "price": "10"}, {"ar": "كوب قهوة سعودية", "en": "Saudi Coffee Cup", "kcal": 5, "price": "7"}, {"ar": "دلة قهوة سعودية", "en": "Saudi Coffee Dallah", "kcal": 25, "price": "25"}]}, {"id": "cold", "en": "Cold Drinks", "ar": "المشروبات الباردة", "sub": null, "items": [{"ar": "آيس أمريكانو", "en": "Iced Americano", "kcal": 15, "price": "14"}, {"ar": "آيس لاتيه", "en": "Iced Latte", "kcal": 150, "price": "15"}, {"ar": "آيس سبانش لاتيه", "en": "Iced Spanish Latte", "kcal": 230, "price": "15"}, {"ar": "آيس ماتشا", "en": "Iced Matcha", "kcal": 200, "price": "19"}, {"ar": "آيس كركديه", "en": "Iced Hibiscus", "kcal": 90, "price": "15"}, {"ar": "آيس تي خوخ", "en": "Peach Iced Tea", "kcal": 120, "price": "15"}, {"ar": "موهيتو كلاسيك", "en": "Classic Mojito", "kcal": 130, "price": "13"}, {"ar": "موهيتو توت", "en": "Berry Mojito", "kcal": 150, "price": "13"}, {"ar": "موهيتو تروبيكال", "en": "Tropical Mojito", "kcal": 160, "price": "13"}, {"ar": "موهيتو صُفّه", "en": "Suffa Mojito", "kcal": 170, "price": "15"}]}, {"id": "bakery", "en": "Bakery", "ar": "من معملنا", "sub": "حلويات تُخبز يومياً في معمل صُفّه · Baked fresh daily in the Suffa kitchen", "items": [{"ar": "كوكيز كلاسيك", "en": "Classic Cookies", "kcal": 220, "price": "8"}, {"ar": "إنجلش كيك", "en": "English Cake", "kcal": 280, "price": "8"}, {"ar": "بسبوسة", "en": "Basbousa", "kcal": 300, "price": "9"}, {"ar": "تيراميسو", "en": "Tiramisu", "kcal": 380, "price": "15"}, {"ar": "كيكة عسل", "en": "Honey Cake", "kcal": 380, "price": "18"}, {"ar": "ميني بان كيك", "en": "Mini Pancakes", "kcal": 350, "price": "18"}, {"ar": "تشيز كيك", "en": "Cheesecake", "kcal": 400, "price": "20"}, {"ar": "سان سباستيان", "en": "San Sebastian", "kcal": 420, "price": "20"}, {"ar": "شوكلت كيك", "en": "Chocolate Cake", "kcal": 450, "price": "20"}, {"ar": "بيكان كيك", "en": "Pecan Cake", "kcal": 480, "price": "20"}, {"ar": "بودنج كوكيز فخار", "en": "Clay‑Pot Cookie Pudding", "kcal": 500, "price": "20"}]}, {"id": "sudan-coffee", "en": "Sudan · Coffee", "ar": "السودان · القهوة", "sub": null, "items": [{"ar": "جبنة سودانية", "en": "Sudanese Jabana", "kcal": 15, "price": "7"}, {"ar": "جبنة في جبنة", "en": "Jabana in Jebena · S / M / L", "kcal": "20 / 30 / 50", "price": "15 / 25 / 35"}]}, {"id": "sudan-tea", "en": "Sudan · Tea", "ar": "السودان · الشاي", "sub": null, "items": [{"ar": "شاي مقنن", "en": "Spiced “Mugannan” Tea", "kcal": 130, "price": "7"}, {"ar": "شيريا", "en": "Shireya", "kcal": 220, "price": "7"}, {"ar": "شاي بالحليب", "en": "Milk Tea", "kcal": 160, "price": "7"}, {"ar": "شاي أحمر", "en": "Black Tea", "kcal": 40, "price": "6"}, {"ar": "شاي أخضر", "en": "Green Tea", "kcal": 30, "price": "6"}, {"ar": "مديدة", "en": "Madida", "kcal": 250, "price": "8"}, {"ar": "مديدة الشيف", "en": "Chef’s Madida", "kcal": 320, "price": "11"}]}, {"id": "teapots", "en": "Teapots", "ar": "الأباريق", "sub": null, "items": [{"ar": "براد شاهي", "en": "Tea Pot", "kcal": 160, "price": "20"}, {"ar": "براد شاهي حليب", "en": "Milk Tea Pot", "kcal": 480, "price": "25"}, {"ar": "براد كرك", "en": "Karak Pot", "kcal": 600, "price": "28"}]}, {"id": "snacks", "en": "Snacks", "ar": "التسالي", "sub": null, "items": [{"ar": "مكسرات تركية", "en": "Turkish Nuts", "kcal": 170, "price": "3"}, {"ar": "قرع مقمّر", "en": "Roasted Pumpkin Seeds", "kcal": 160, "price": "3"}, {"ar": "حب شمسي", "en": "Sunflower Seeds", "kcal": 160, "price": "3"}, {"ar": "حب باجة", "en": "Baja Seeds", "kcal": 150, "price": "3"}, {"ar": "كاجو وفستق", "en": "Cashew & Pistachio", "kcal": 180, "price": "5"}, {"ar": "بسكويت سمسم", "en": "Sesame Biscuit", "kcal": 120, "price": "2"}, {"ar": "بسكويت", "en": "Biscuit", "kcal": 80, "price": "1.5"}]}, {"id": "games", "en": "Games", "ar": "الألعاب", "sub": "الساعة بـ 15 ريال · 15 SAR per hour", "items": [{"ar": "شطرنج", "en": "Chess", "kcal": null, "price": "15"}, {"ar": "طاولة", "en": "Backgammon", "kcal": null, "price": "15"}, {"ar": "ورق بلوت", "en": "Baloot Cards", "kcal": null, "price": "15"}, {"ar": "جيكارو", "en": "Jackaroo", "kcal": null, "price": "15"}, {"ar": "اونو", "en": "UNO", "kcal": null, "price": "15"}]}];
let lang='ar';
try{lang=localStorage.getItem('suffa-lang')||'ar'}catch(e){}
const $=s=>document.querySelector(s);
const items={}; DATA.forEach(c=>c.items.forEach((it,i)=>{it.id=c.id+'-'+i;it.cat=c.id;items[it.id]=it}));

function fmtKcal(k){ if(k==null||k==='')return ''; return lang==='ar'? k+' سعرة' : k+' kcal'; }
let cat='all';
function build(filter=''){
  const f=filter.trim().toLowerCase(); const m=$('#menu'); m.innerHTML='';
  let any=false;
  DATA.forEach(c=>{
    if(cat!=='all'&&!f&&c.id!==cat)return;
    const its=c.items.filter(it=>!f||it.ar.includes(f)||it.en.toLowerCase().includes(f)||c.ar.includes(f)||c.en.toLowerCase().includes(f));
    if(!its.length)return; any=true;
    const s=document.createElement('section'); s.id=c.id;
    const sub=c.sub?`<div class="sub">${c.sub}</div>`:'';
    s.innerHTML=`<h2><span>${lang==='ar'?c.ar:c.en}</span><em>${lang==='ar'?c.en:c.ar}</em></h2>${sub}`+its.map(it=>{
      return `<div class="it">
        <div class="nm"><b>${lang==='ar'?it.ar:it.en}</b><em>${lang==='ar'?it.en:it.ar}</em></div>
        <span class="k">${fmtKcal(it.kcal)}</span><span class="ld"></span><span class="p">${it.price}</span>
</div>`}).join('');
    m.appendChild(s);
  });
  if(!any) m.innerHTML=`<div class="empty">${lang==='ar'?'ما لقينا شي بهذا الاسم':'Nothing matches that'}</div>`;
}
function buildTabs(){
  $('#tabs').innerHTML=`<button data-t="all" class="${cat==='all'?'on':''}">${lang==='ar'?'الكل':'All'}</button>`+DATA.map(c=>`<button data-t="${c.id}" class="${cat===c.id?'on':''}">${lang==='ar'?c.ar:c.en}</button>`).join('');
}
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.style.fontFamily=lang==='ar'?'var(--f-ar)':'var(--f-en)';
  document.querySelectorAll('[data-ar]').forEach(el=>{const t=el.getAttribute('data-'+lang); if(el.querySelector('span')&&el.classList.contains('slog')){el.querySelector('span').textContent=t}else el.textContent=t});
  $('#q').placeholder=lang==='ar'?'ابحث في المنيو':'Search the menu';
  $('#bAr').setAttribute('aria-pressed',lang==='ar'); $('#bEn').setAttribute('aria-pressed',lang==='en');
  buildTabs(); build($('#q').value);
}
function setLang(l){lang=l;try{localStorage.setItem('suffa-lang',l)}catch(e){};applyLang()}
$('#bAr').onclick=()=>setLang('ar'); $('#bEn').onclick=()=>setLang('en');
$('#q').addEventListener('input',e=>{if(e.target.value.trim()&&cat!=='all'){cat='all';buildTabs()}build(e.target.value)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.t;$('#q').value='';buildTabs();build();b.scrollIntoView({block:'nearest',inline:'center'});window.scrollTo({top:$('.rail').offsetTop,behavior:'smooth'})});

function price(it){const n=parseFloat(String(it.price).split('/')[0]);return isNaN(n)?0:n}

applyLang();
</script>

</body>
</html>
